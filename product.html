<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر أورورا | تفاصيل المنتج</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">أورورا.</a>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="shop.html">المتجر</a></li>
                <li><a href="login.html">تسجيل الدخول</a></li>
            </ul>
            <div style="display: flex; gap: 1.5rem; align-items: center;">
                <button id="theme-toggle" class="theme-toggle">🌙</button>
                <a href="cart.html" class="cart-icon">
                    <span class="material-symbols-outlined">shopping_cart</span>
                    <span class="cart-count">0</span>
                </a>
                <button id="menu-toggle" class="menu-toggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </nav>
        <ul class="mobile-nav" id="mobile-nav">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="shop.html">المتجر</a></li>
            <li><a href="login.html">تسجيل الدخول</a></li>
        </ul>
    </header>

    <main>
        <div id="product-container">
            <p style="text-align: center; color: var(--text-secondary);">جاري تحميل المنتج...</p>
        </div>

        <!-- Reviews Section -->
        <section id="reviews-section" class="reviews-section" style="display: none; margin-top: 4rem;">
            <h2 class="section-title">التقييمات والتعليقات</h2>

            <!-- Review Form -->
            <div class="review-form-container">
                <h3>أضف تقييمك</h3>
                <form id="review-form" class="review-form">
                    <div class="form-group">
                        <label>اسمك</label>
                        <input type="text" id="reviewer-name" placeholder="أدخل اسمك" required>
                    </div>

                    <div class="form-group">
                        <label>التقييم</label>
                        <div class="star-rating" id="rating-selector">
                            <span class="star" data-rating="1">⭐</span>
                            <span class="star" data-rating="2">⭐</span>
                            <span class="star" data-rating="3">⭐</span>
                            <span class="star" data-rating="4">⭐</span>
                            <span class="star" data-rating="5">⭐</span>
                        </div>
                        <input type="hidden" id="rating-value" value="0" required>
                        <p id="rating-label" style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 0.5rem;">اختر تقييماً</p>
                    </div>

                    <div class="form-group">
                        <label>تعليقك</label>
                        <textarea id="review-comment" placeholder="شارك رأيك في المنتج..." rows="4" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">إرسال التقييم</button>
                </form>
            </div>

            <!-- Reviews List -->
            <div id="reviews-list" class="reviews-list">
                <p style="text-align: center; color: var(--text-secondary);">لا توجد تقييمات حتى الآن. كن أول من يقيّم هذا المنتج!</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 متجر أورورا. جميع الحقوق محفوظة.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/product.js"></script>
</body>
</html>
